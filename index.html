<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Color your reality Radio</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="logo">
        Color your reality Radio
    </div>

    <div class="controls">

        <button id="playButton">Play</button>

        <button id="nextButton">Next</button>

    </div>

    <div class="volume">

        <input type="range" id="volumeControl" min="0" max="1" step="0.01" value="0.5">

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
