<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<title>Color your reality Radio</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">


<div class="top">

<img src="img/cyrr_logo.png" alt="Color your reality Radio logo">

</div>


<div class="bottom">


<div class="controls">

<button id="playButton" class="playButton">
▶
</button>

<button id="nextButton" class="nextButton">
⏭
</button>

</div>


<div class="volume">

<input type="range"
id="volume"
min="0"
max="100"
value="50">

</div>


</div>

</div>


<script src="script.js"></script>

</body>

</html>
